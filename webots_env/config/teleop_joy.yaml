teleop_twist_joy:
  ros__parameters:

    require_enable_button: true
    enable_button: 4     # LB button

    axis_linear:
      x: 1               # left stick vertical
      y: 0               # left stick horizontal

    axis_angular:
      yaw: 3             # right stick horizontal

    scale_linear:
      x: 0.6
      y: 0.6

    scale_angular:
      yaw: 1.5

    deadzone: 0.05